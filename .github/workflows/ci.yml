name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - name: Check complete experiment evidence and report templates in the source archive
        run: python scripts/check_sdist.py --source . --archive dist/*.tar.gz
      - name: Verify received evidence from the installed wheel without runtime tools
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="" "$RUNNER_TEMP/installed/bin/python" \
            "$GITHUB_WORKSPACE/scripts/check_installed.py" --source "$GITHUB_WORKSPACE"
      - name: Retain the installed and verified release distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
  docker-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ["durable-kv", "support-routing", "robot-evidence-review"]
        language: ["python", "javascript"]
        include:
          - language: python
            image: python:3.12-slim
          - language: javascript
            image: node:22-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: docker pull ${{ matrix.image }}
      - run: evalarc audit --task ${{ matrix.task }} --language ${{ matrix.language }} --image ${{ matrix.image }} --seeds 17 --output runs/docker-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grader-audit-${{ matrix.task }}-${{ matrix.language }}
          path: runs/docker-audit/
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate the Space card before merge
        run: |
          python -m pip install huggingface_hub==1.31.0
          python -c "from huggingface_hub import SpaceCard; SpaceCard.load('huggingface/README.md').validate()"
      - run: python scripts/build_site.py --output dist/site
      - run: python scripts/build_dataset.py --output dist/casebook
      - run: python scripts/swe_dataset.py --output dist/independent-swe-dataset
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - run: node scripts/check_model_upgrade.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-site
          path: dist/site/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-casebook
          path: dist/casebook/
      - uses: actions/upload-artifact@v4
        with:
          name: independent-swe-dataset
          path: dist/independent-swe-dataset/
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: A higher headline score with regressed checks fails the action
        id: regressed
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/results-diff/inspect/baseline.json
          current: examples/results-diff/inspect/current.json
          output: runs/action-regressed
      - name: Identical promptfoo results pass the action
        id: unchanged
        uses: ./
        with:
          baseline: examples/results-diff/promptfoo/current.json
          current: examples/results-diff/promptfoo/current.json
          output: runs/action-unchanged
      - name: Unusable input fails even when regressions are allowed
        id: unusable
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/results-diff/promptfoo/current.json
          current: examples/results-diff/junit/current.xml
          output: runs/action-unusable
          fail-on-regression: "false"
      - name: A held-out split and leaked harness text are reported and can be required
        id: heldout
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/results-diff/inspect/baseline.json
          current: examples/results-diff/inspect/current.json
          output: runs/action-heldout
          held-out: examples/results-diff/inspect/split.json
          harness: examples/results-diff/inspect/harness
          require-generalization: "true"
      - name: A cost gate on recorded durations passes for identical results
        id: cost
        uses: ./
        with:
          baseline: examples/results-diff/promptfoo/current.json
          current: examples/results-diff/promptfoo/current.json
          output: runs/action-cost
          max-cost-ratio: "1.0"
          cost-metric: duration
      - name: Check the reported outcomes
        env:
          COST_RATIO: ${{ steps.cost.outputs.cost-ratio }}
          REGRESSED: ${{ steps.regressed.outcome }}
          BLOCKING: ${{ steps.regressed.outputs.blocking-changes }}
          GATE: ${{ steps.regressed.outputs.gate-passed }}
          UNCHANGED: ${{ steps.unchanged.outputs.gate-passed }}
          UNUSABLE: ${{ steps.unusable.outcome }}
          HELDOUT: ${{ steps.heldout.outcome }}
          STATE: ${{ steps.heldout.outputs.generalization-state }}
          LEAKS: ${{ steps.heldout.outputs.leakage-hits }}
        run: |
          test "$REGRESSED" = failure
          test "$BLOCKING" = 3
          test "$GATE" = false
          test "$UNCHANGED" = true
          test "$UNUSABLE" = failure
          test "$HELDOUT" = failure
          test "$STATE" = held_out_gain_within_noise
          test "$LEAKS" = 2
          test "$COST_RATIO" = 1.0
          test -f runs/action-heldout/split.json
          test -f runs/action-regressed/index.html
          cmp runs/action-regressed/current.json examples/results-diff/inspect/current.json
      - name: Hillclimb review keeps cost steps and rejects the overfit step
        run: |
          python -m pip install --quiet .
          evalarc hillclimb-review examples/hillclimb-review/results/00-baseline.json \
            examples/hillclimb-review/results/0[1-5]-*.json \
            --held-out examples/hillclimb-review/split.json --objective cost \
            --output runs/hillclimb --markdown "$GITHUB_STEP_SUMMARY"
          python -c "import json; r = json.load(open('runs/hillclimb/hillclimb.json')); assert r['recommendation'] == 'merge_cost'; assert [s['decision'] for s in r['steps']] == ['keep', 'rollback_overfit', 'keep', 'rollback_regression', 'keep']"
          set +e
          evalarc hillclimb-review examples/hillclimb-review/results/00-baseline.json \
            examples/hillclimb-review/results/0[1-5]-*.json \
            --held-out examples/hillclimb-review/split.json
          test $? -eq 1
      - name: Blind judging packets keep verdicts out of the shared folder
        run: |
          python -m pip install --quiet .
          evalarc judge-packet grader examples/results-diff/inspect/current.json \
            --sample 10 --output runs/judge-grader
          ! grep -r recorded_passed runs/judge-grader/share
          evalarc judge-packet pairwise examples/results-diff/inspect/baseline.json \
            examples/results-diff/inspect/current.json --output runs/judge-pairwise
          ! grep -r current_is runs/judge-pairwise/share
          evalarc eval-health examples/results-diff/inspect/current.json \
            --cases examples/results-diff/inspect/cases.json --json \
            | python -c "import json, sys; assert 'adversarial_sampling' in {f['id'] for f in json.load(sys.stdin)['findings']}"
      - name: Hillclimb run keeps root-cause fixes and rejects pasted cases
        run: |
          python -m pip install --quiet .
          cp -r examples/hillclimb-run "$RUNNER_TEMP/climb"
          evalarc hillclimb-run "$RUNNER_TEMP/climb/hillclimb.toml" --output runs/climb --trust-local
          python -c "import json; s = json.load(open('runs/climb/loop.json')); assert [x['decision'] for x in s['steps']] == ['keep', 'rollback_pasted_case', 'rollback_overfit', 'no_change', 'keep'], s"
          evalarc judge-packet pairwise runs/climb/results/00-baseline.json runs/climb/results/05.json --output runs/climb-ab
          evalarc judge-run runs/climb-ab --config "$RUNNER_TEMP/climb/judge.toml" --output runs/climb-ab.json --trust-local
          evalarc judge-score runs/climb-ab runs/climb-ab.json --require-current-preferred
      - name: A scaffolded evaluation project runs through every command
        run: |
          python -m pip install --quiet .
          evalarc eval-init "$RUNNER_TEMP/proj"
          cd "$RUNNER_TEMP/proj"
          evalarc review-inputs cases.jsonl --output ../review --write-split split.json \
            --write-manifest cases.manifest.json
          python evaluate.py ../baseline.json --epochs 3
          evalarc eval-health ../baseline.json --cases cases.manifest.json --output ../health
          evalarc judge-packet grader ../baseline.json --sample 6 --output ../spot
          set +e
          evalarc hillclimb-run hillclimb.toml --output ../climb --trust-local
          test $? -eq 1
      - name: Eval health reports noise above the minimum effect
        run: |
          python -m pip install --quiet .
          evalarc eval-health examples/results-diff/inspect/baseline.json \
            examples/results-diff/inspect/current.json --ordered --min-effect 0.05 \
            --output runs/eval-health --markdown "$GITHUB_STEP_SUMMARY"
          set +e
          evalarc eval-health examples/results-diff/inspect/current.json \
            --min-effect 0.05 --require-healthy
          test $? -eq 1
  strands-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/strands-state-review/requirements.lock.txt
      - run: python -m pip install -r examples/strands-state-review/requirements.lock.txt
      - name: Recheck native Strands reports without network access
        run: python scripts/check_strands_recipe.py
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'noteflowai/evalarc'
    needs: [test, docker-audit, site, strands-recipe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: evidence-site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
  huggingface:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'noteflowai/evalarc'
    needs: [test, docker-audit, site, strands-recipe]
    runs-on: ubuntu-latest
    concurrency:
      group: huggingface
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: evidence-site
          path: dist/site
      - uses: actions/download-artifact@v4
        with:
          name: evidence-casebook
          path: dist/casebook
      - uses: actions/download-artifact@v4
        with:
          name: independent-swe-dataset
          path: dist/independent-swe-dataset
      - run: python -m pip install huggingface_hub==1.31.0
      - name: Publish and verify public files
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          python scripts/publish_space.py --bundle dist/site
          python scripts/publish_dataset.py --bundle dist/casebook
          python scripts/swe_dataset.py --publish --output dist/independent-swe-dataset
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check actual Hub downloads and judgment review
        env:
          SITE_URL: https://huggingface.co/spaces/glayguo/evalarc
          SITE_DIR: dist/site
        run: node scripts/check_hosted_downloads.cjs
