name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - name: Check complete behavior evidence in the source archive
        run: python scripts/check_sdist.py --source . --archive dist/*.tar.gz
      - name: Verify received evidence from the installed wheel without runtime tools
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="" "$RUNNER_TEMP/installed/bin/python" \
            "$GITHUB_WORKSPACE/scripts/check_installed.py" --source "$GITHUB_WORKSPACE"
  docker-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ["durable-kv", "support-routing", "robot-evidence-review"]
        language: ["python", "javascript"]
        include:
          - language: python
            image: python:3.12-slim
          - language: javascript
            image: node:22-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: docker pull ${{ matrix.image }}
      - run: evalarc audit --task ${{ matrix.task }} --language ${{ matrix.language }} --image ${{ matrix.image }} --seeds 17 --output runs/docker-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grader-audit-${{ matrix.task }}-${{ matrix.language }}
          path: runs/docker-audit/
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate the Space card before merge
        run: |
          python -m pip install huggingface_hub==1.31.0
          python -c "from huggingface_hub import SpaceCard; SpaceCard.load('huggingface/README.md').validate()"
      - run: python scripts/build_site.py --output dist/site
      - run: python scripts/build_dataset.py --output dist/casebook
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-site
          path: dist/site/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-casebook
          path: dist/casebook/
  strands-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/strands-state-review/requirements.lock.txt
      - run: python -m pip install -r examples/strands-state-review/requirements.lock.txt
      - name: Recheck native Strands reports without network access
        run: python scripts/check_strands_recipe.py
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'noteflowai/evalarc'
    needs: [test, docker-audit, site, strands-recipe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: evidence-site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
  huggingface:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'noteflowai/evalarc'
    needs: [test, docker-audit, site, strands-recipe]
    runs-on: ubuntu-latest
    concurrency:
      group: huggingface
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: evidence-site
          path: dist/site
      - uses: actions/download-artifact@v4
        with:
          name: evidence-casebook
          path: dist/casebook
      - run: python -m pip install huggingface_hub==1.31.0
      - name: Publish and verify public files
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          python scripts/publish_space.py --bundle dist/site
          python scripts/publish_dataset.py --bundle dist/casebook
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check actual Hub downloads and judgment review
        env:
          SITE_URL: https://huggingface.co/spaces/glayguo/evalarc
          SITE_DIR: dist/site
        run: node scripts/check_hosted_downloads.cjs
