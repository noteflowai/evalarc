# Publish an existing GitHub release to PyPI with trusted publishing (no API token).
#
# Inactive until a maintainer registers this workflow as a trusted publisher on
# PyPI and/or TestPyPI (project "evalarc", workflow "publish-pypi.yml",
# environment "pypi" or "testpypi") and creates the matching environment in the
# repository settings, ideally with required reviewers. It uploads the exact
# wheel and source archive attached to the release, so PyPI serves the same
# bytes and SHA-256 digests as the GitHub release and the pinned install commands.
name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.14.0
        required: true
      repository:
        description: testpypi for a rehearsal, or pypi
        type: choice
        options: [testpypi, pypi]
        default: testpypi
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the release distributions and check their digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$TAG"
          for name in "evalarc-$version-py3-none-any.whl" "evalarc-$version.tar.gz"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir dist
            expected=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .digest")
            test "sha256:$(sha256sum "dist/$name" | cut -d' ' -f1)" = "$expected"
          done
          test "$(ls dist | wc -l)" = 2
      - run: python -m pip install "twine>=6,<7"
      - run: python -m twine check --strict dist/*
      - name: Check the source archive and the installed wheel
        run: |
          python scripts/check_sdist.py --source . --archive dist/*.tar.gz
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="" "$RUNNER_TEMP/installed/bin/python" \
            "$GITHUB_WORKSPACE/scripts/check_installed.py" --source "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'pypi' && 'https://pypi.org/p/evalarc' || 'https://test.pypi.org/p/evalarc' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
